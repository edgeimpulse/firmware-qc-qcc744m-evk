# QConn_Flash config for the QCC744M EVK (BL618).
#
# Two images per the Zephyr board docs:
#   https://docs.zephyrproject.org/latest/boards/qcom/qcc744m_evk/doc/index.html
#     boot2   -> 0x0000   (flash once; survives app updates)
#     zephyr  -> 0x2000   (the application image)
#
# Paths below are relative to the WORKSPACE ROOT (the dir that holds ./build
# and ./QCCSDK-QCC74x-master). Invoke from there, e.g.:
#
#   cd /home/francesco/work/zephyr/zephyrproject
#   QCCSDK-QCC74x-master/tools/qcc74x_tools/QConn_Flash/QConn_Flash_Cmd-ubuntu \
#       --interface=uart --baudrate=2000000 --port=/dev/ttyACM1 --cpu_id= \
#       --config=firmware-qc-qcc744m-evk/flash_prog_cfg.ini
#
# Or just run firmware-qc-qcc744m-evk/flash.sh, which handles paths for you.

[cfg]
# 0: no erase, 1: erase only the sections being programmed, 2: whole-chip erase.
# 1 keeps boot2 intact when you re-flash just the app.
erase = 1
skip_mode = 0x0, 0x0
# 0: not ISP mode, 1: ISP mode
boot2_isp_mode = 0

[boot2]
filedir = ./boot2_config/boot2_qcc743_isp_release_v8.1.9.bin
address = 0x000000

[FW]
filedir = ./build/zephyr/zephyr.bin
address = 0x002000
