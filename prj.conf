CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# EI DSP heap (ei_malloc -> k_malloc). MFCC peak is ~12 KB; keep comfortable
# headroom so bigger models / more slices don't OOM. RAM is <35% used.
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Enable events
CONFIG_EVENTS=y

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y
# 0: malloc/free, 1: k_malloc/k_free
CONFIG_EDGE_IMPULSE_HEAP_TYPE=1

CONFIG_SAMPLING_FREQUENCY_HZ=50

# Sensors
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# Arduino Modulino Pixels (I2C LED strip)
CONFIG_LED_STRIP=y

# Arduino Modulino Buttons (I2C, via the input subsystem)
CONFIG_INPUT=y
